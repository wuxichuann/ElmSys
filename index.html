<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>馋了么 - 菜品展示</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-ui@2.15.6/lib/theme-chalk/index.css">
  <script src="https://cdn.jsdelivr.net/npm/element-ui@2.15.6/lib/index.js"></script>
  <style>
    body {
      font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
    }
    .app-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h1 {
      color: #ff4d4f;
      font-size: 28px;
    }
    .restaurant-info {
      background: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    .dish-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .dish-card {
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s;
    }
    .dish-card:hover {
      transform: translateY(-5px);
    }
    .dish-image {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }
    .dish-info {
      padding: 15px;
    }
    .dish-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .dish-price {
      color: #ff4d4f;
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .dish-desc {
      color: #666;
      font-size: 14px;
      margin-bottom: 12px;
    }
    .category-tag {
      display: inline-block;
      padding: 2px 8px;
      background: #f0f9eb;
      color: #67c23a;
      border-radius: 4px;
      font-size: 12px;
    }
    .loading {
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="app-container">
      <div class="header">
        <h1>🍜 馋了么餐饮服务平台</h1>
      </div>
      
      <div class="restaurant-info">
        <h2>{{ restaurant.name }}</h2>
        <p>{{ restaurant.description }}</p>
        <p>营业时间: {{ restaurant.businessHours }}</p>
      </div>
      
      <el-row :gutter="20">
        <el-col :span="24">
          <el-input
            placeholder="搜索菜品..."
            v-model="searchQuery"
            @input="filterDishes"
            clearable>
            <el-button slot="append" icon="el-icon-search"></el-button>
          </el-input>
        </el-col>
      </el-row>
      
      <div v-if="loading" class="loading">
        <i class="el-icon-loading"></i> 加载中...
      </div>
      
      <div v-else class="dish-list">
        <div class="dish-card" v-for="dish in filteredDishes" :key="dish.id">
          <img :src="dish.image_url || 'https://via.placeholder.com/300x180?text=No+Image'" 
               :alt="dish.name" class="dish-image">
          <div class="dish-info">
            <div class="dish-name">{{ dish.name }}</div>
            <div class="dish-price">¥{{ dish.price }}</div>
            <div class="dish-desc">{{ dish.description }}</div>
            <span class="category-tag">{{ dish.category }}</span>
            <el-button type="danger" size="small" @click="addToCart(dish)" plain 
                       style="float: right;">加入购物车</el-button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    new Vue({
      el: '#app',
      data() {
        return {
          restaurant: {
            name: '美味小馆',
            description: '提供各种家常菜和特色小吃',
            businessHours: '10:00-22:00'
          },
          dishes: [],
          filteredDishes: [],
          loading: true,
          searchQuery: ''
        }
      },
      async created() {
        await this.fetchDishes();
      },
      methods: {
        async fetchDishes() {
          try {
            this.loading = true;
            const response = await axios.get('http://localhost:3000/api/dishes');
            this.dishes = response.data;
            this.filteredDishes = [...this.dishes];
          } catch (error) {
            console.error('Error fetching dishes:', error);
            this.$message.error('获取菜品数据失败');
          } finally {
            this.loading = false;
          }
        },
        filterDishes() {
          if (!this.searchQuery) {
            this.filteredDishes = [...this.dishes];
            return;
          }
          const query = this.searchQuery.toLowerCase();
          this.filteredDishes = this.dishes.filter(dish => 
            dish.name.toLowerCase().includes(query) || 
            dish.description.toLowerCase().includes(query) ||
            dish.category.toLowerCase().includes(query)
          );
        },
        addToCart(dish) {
          this.$message({
            message: `已添加 ${dish.name} 到购物车`,
            type: 'success'
          });
          // 这里可以添加实际的购物车逻辑
        }
      }
    });
  </script>
</body>
</html>
